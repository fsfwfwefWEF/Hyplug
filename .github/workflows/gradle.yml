name: Build plugin jar

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: BodyCam-plugin
        path: build/libs/*.jar
        if-no-files-found: error

    # Кладём собранный jar в Releases, чтобы его можно было скачать одной ссылкой:
    # https://github.com/ayaft1445-eng/hytaleplug/releases/latest
    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete bodycam-latest --yes --cleanup-tag || true
        gh release create bodycam-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "BodyCam — последняя сборка" \
          --notes "Камера от первого лица, в которой видно всё своё тело.

        Как поставить: скачайте файл .jar ниже и положите его в папку plugins/ (или mods/) сервера, затем перезапустите сервер. Старый SimpleMenu-*.jar удалите.

        Команды: /bodycam — вкл/выкл, /bodycam forward <число>, /bodycam up <число>, /bodycam reset, /bodycam info.

        Инструкция целиком: INSTALL-RU.md в репозитории."
